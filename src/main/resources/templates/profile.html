<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <div class="page-heading">
        <div>
            <p class="eyebrow">ACCOUNT</p>
            <h1>My profile</h1>
            <p class="page-subtitle"><span th:text="${roleLabel}">Teacher</span> account details</p>
        </div>
        <span class="role-pill profile-role" th:text="${roleLabel}">Teacher</span>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <form th:action="@{${action}}" th:object="${form}" method="post" class="content-card form">
        <div class="readonly-note">Username: <strong th:text="${form.username}">username</strong></div>
        <label>First name
            <input type="text" th:field="*{firstName}" placeholder="First name" required>
            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </label>
        <label>Last name
            <input type="text" th:field="*{lastName}" placeholder="Last name" required>
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </label>
        <label>Email <span class="muted">(optional)</span>
            <input type="email" th:field="*{email}" placeholder="name@example.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn">Save changes</button>
            <a class="btn btn-outline-dark" th:href="@{/account/password}">Change password</a>
        </div>
    </form>
</main>
</body>
</html>
