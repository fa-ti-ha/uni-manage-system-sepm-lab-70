<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<!-- Shown by Spring Boot for website errors (403, 404, 500 ...) -->
<main class="container narrow">
    <div class="card">
        <h1 th:text="${status}">Error</h1>
        <p th:if="${status == 403}">You don't have permission to open this page.</p>
        <p th:if="${status == 404}">This page or record was not found.</p>
        <p th:unless="${status == 403 or status == 404}" th:text="${error}">Something went wrong.</p>
        <a class="btn" th:href="@{/}">Back to my home page</a>
    </div>
</main>
</body>
</html>
