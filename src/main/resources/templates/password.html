<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <a class="back-link" th:href="@{/}">← Back</a>
    <div class="page-heading">
        <div>
            <p class="eyebrow">ACCOUNT SETTINGS</p>
            <h1>Change password</h1>
            <p class="page-subtitle">Choose a new password for your account.</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <form th:action="@{/account/password}" th:object="${form}" method="post" class="content-card form">
        <label>Current password
            <input type="password" th:field="*{currentPassword}" placeholder="Enter current password" required>
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </label>
        <label>New password
            <input type="password" th:field="*{newPassword}" placeholder="Enter new password" required>
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </label>
        <label>Repeat new password
            <input type="password" th:field="*{confirmPassword}" placeholder="Type new password again" required>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn">Update password</button>
        </div>
    </form>
</main>
</body>
</html>
