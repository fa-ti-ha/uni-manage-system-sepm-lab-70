spring.application.name=university

# ---- Database ----
# Running from IntelliJ: no URL needed. Docker Compose Support starts compose.yaml (PostgreSQL 17)
# and connects to it by itself. Inside Docker the URL comes from environment variables (see compose.yaml).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Login session (cookie JSESSIONID) ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ---- First accounts (created only when they don't exist yet) ----
app.admin.username=admin
app.admin.password=admin123
# Also create teacher1/teacher123 and student1/student123 for testing
app.demo-users=true
