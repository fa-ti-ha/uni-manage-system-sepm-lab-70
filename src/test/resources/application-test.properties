# Settings used only by the integration tests (@ActiveProfiles("test")).

# Running tests on your PC (IntelliJ / mvn test): let Spring Boot start PostgreSQL from compose.yaml,
# exactly like when you run the app. Docker Desktop must be running.
# On GitHub Actions this is switched off (SPRING_DOCKER_COMPOSE_ENABLED=false) and the
# PostgreSQL service of the workflow is used instead (see .github/workflows/ci.yml).
spring.docker.compose.skip.in-tests=false
