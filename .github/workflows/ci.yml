name: CI - Unit and Integration Tests

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    # Starts PostgreSQL 17 next to the job so the integration tests have a real database
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: university_test
          POSTGRES_USER: university
          POSTGRES_PASSWORD: university123
        ports:
          - 5432:5432
        # Wait until PostgreSQL is ready before the steps start
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B clean test
        env:
          # Use the PostgreSQL service above instead of starting compose.yaml
          SPRING_DOCKER_COMPOSE_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/university_test
          SPRING_DATASOURCE_USERNAME: university
          SPRING_DATASOURCE_PASSWORD: university123

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
